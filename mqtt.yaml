# Home Assistant MQTT sensors for qGames
# Copy this file's contents into your configuration.yaml under the mqtt: key,
# or include it directly with:
#
#   mqtt: !include mqtt.yaml
#
# Trigger automations off the *_ts sensors — they always change, even when
# other values (score, result) repeat across back-to-back games.

mqtt:
  sensor:

    # ── Paint ────────────────────────────────────────────────────────────────
    - name: "qGames Paint Last Saved"
      unique_id: "qgames_paint_ts"
      state_topic: "qGames/paint/ts"
      value_template: "{{ value | int | timestamp_local }}"
      icon: "mdi:clock-outline"

    - name: "qGames Paint Saved File"
      unique_id: "qgames_paint_saved"
      state_topic: "qGames/paint/saved"
      icon: "mdi:image"

    # ── Memory Match ─────────────────────────────────────────────────────────
    - name: "qGames Memory Last Played"
      unique_id: "qgames_memory_ts"
      state_topic: "qGames/memory/ts"
      value_template: "{{ value | int | timestamp_local }}"
      icon: "mdi:clock-outline"

    - name: "qGames Memory Moves"
      unique_id: "qgames_memory_moves"
      state_topic: "qGames/memory/moves"
      unit_of_measurement: "moves"
      icon: "mdi:cards"

    - name: "qGames Memory Result"
      unique_id: "qgames_memory_result"
      state_topic: "qGames/memory/result"
      icon: "mdi:trophy"

    # ── Battleship ───────────────────────────────────────────────────────────
    - name: "qGames Battleship Last Played"
      unique_id: "qgames_battleship_ts"
      state_topic: "qGames/battleship/ts"
      value_template: "{{ value | int | timestamp_local }}"
      icon: "mdi:clock-outline"

    - name: "qGames Battleship Result"
      unique_id: "qgames_battleship_result"
      state_topic: "qGames/battleship/result"
      icon: "mdi:trophy"

    - name: "qGames Battleship Shots"
      unique_id: "qgames_battleship_shots"
      state_topic: "qGames/battleship/shots"
      unit_of_measurement: "shots"
      icon: "mdi:target"

    # ── Sequence ─────────────────────────────────────────────────────────────
    - name: "qGames Sequence Last Completed"
      unique_id: "qgames_sequence_ts"
      state_topic: "qGames/sequence/ts"
      value_template: "{{ value | int | timestamp_local }}"
      icon: "mdi:clock-outline"

    - name: "qGames Sequence Score"
      unique_id: "qgames_sequence_score"
      state_topic: "qGames/sequence/score"
      unit_of_measurement: "correct"
      icon: "mdi:star"

    - name: "qGames Sequence Total"
      unique_id: "qgames_sequence_total"
      state_topic: "qGames/sequence/total"
      unit_of_measurement: "questions"
      icon: "mdi:counter"

    # ── Simon ─────────────────────────────────────────────────────────────────
    - name: "qGames Simon Last Played"
      unique_id: "qgames_simon_ts"
      state_topic: "qGames/simon/ts"
      value_template: "{{ value | int | timestamp_local }}"
      icon: "mdi:clock-outline"

    - name: "qGames Simon Rounds"
      unique_id: "qgames_simon_rounds"
      state_topic: "qGames/simon/rounds"
      unit_of_measurement: "rounds"
      icon: "mdi:brain"
