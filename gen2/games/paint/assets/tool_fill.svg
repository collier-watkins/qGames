<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- A bucket tipped to pour. Straight tapered sides and a flat rim read as
       a bucket at 24px; a curved silhouette just reads as a blob. -->
  <g transform="rotate(-28 11 11)">
    <path d="M4 7 h14 l-2.4 10 h-9.2 z" fill="none" stroke="#23262b"
          stroke-width="2.2" stroke-linejoin="round"/>
    <line x1="3.2" y1="7" x2="18.8" y2="7" stroke="#23262b"
          stroke-width="2.6" stroke-linecap="round"/>
    <path d="M7.4 6 a3.8 3.8 0 0 1 7.2 0" fill="none" stroke="#23262b" stroke-width="1.8"/>
  </g>
  <circle cx="18.6" cy="19.4" r="2.5" fill="#23262b"/>
</svg>
