  #       run: echo "TODO: android-actions/setup-android, or manual sdkmanager install"
  #     - name: Restore keystore from secrets
  #       run: echo "TODO: base64 -d <<< \"$ANDROID_KEYSTORE_BASE64\" > keystore.jks"
  #     - name: Export Android APK
