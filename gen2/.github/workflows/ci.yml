name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Bump this one line to move the whole pipeline to a new Godot release.
  # Must match a tag under https://github.com/godotengine/godot-builds/releases.
  GODOT_VERSION: 4.7.2-stable

jobs:
  build:
    runs-on: ubuntu-latest
    # Godot's Linux export templates cross-export arm64 from an x86_64 editor —
    # there is no arm64 runner or cross-compiler involved. Keep this job on
    # ubuntu-latest (x86_64).
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # actions/checkout does a plain `git checkout`, which preserves
        # symlinks on Linux runners — needed for games/*/addons/qcore ->
        # ../../../shared/qcore.

      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-editor
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ runner.os }}

      - name: Download Godot editor
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          mkdir -p /tmp/godot_extracted ~/godot-editor
          unzip -q /tmp/godot.zip -d /tmp/godot_extracted
          mv "/tmp/godot_extracted/Godot_v${GODOT_VERSION}_linux.x86_64" ~/godot-editor/godot
          chmod +x ~/godot-editor/godot

      - name: Download export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # Release tag uses a dash (4.7.2-stable); the on-disk template
          # directory Godot expects uses a dot (4.7.2.stable).
          TEMPLATE_DIR_NAME="${GODOT_VERSION/-/.}"
          INSTALL_DIR="$HOME/.local/share/godot/export_templates/${TEMPLATE_DIR_NAME}"
          mkdir -p "$INSTALL_DIR" /tmp/templates_extracted
          curl -fL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          # The .tpz is a zip with everything under a top-level templates/ dir.
          unzip -q /tmp/templates.tpz -d /tmp/templates_extracted
          cp -r /tmp/templates_extracted/templates/. "$INSTALL_DIR/"

      - name: Add Godot to PATH
        run: echo "$HOME/godot-editor" >> "$GITHUB_PATH"

      - name: Godot version sanity check
        run: godot --version

      - name: Headless import (every game)
        run: |
          set -euo pipefail
          shopt -s nullglob
          for proj in games/*/project.godot; do
            g="$(basename "$(dirname "$proj")")"
            echo "== import: $g =="
            make import GAME="$g"
          done

      - name: Run tests (every game)
        run: make test-all

      - name: Export (Linux x86_64 + arm64, every game)
        run: make export-all

      - name: Upload dist/
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android APK build — deliberately NOT enabled yet.
  #
  # Needs, beyond what this job sets up:
  #   - JDK 17                          (actions/setup-java, distribution: temurin)
  #   - Android SDK (cmdline-tools + the platform/build-tools versions Godot's
  #     Android build template requires)
  #   - A release keystore + its passwords, held in repo secrets (e.g.
  #     ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
  #     ANDROID_KEY_PASSWORD), decoded to a file at job start and never logged.
  #
  # Uncomment and fill in once that infra exists.
