# Home Assistant MQTT sensors for qGames - Paint
# Copy the relevant blocks into your configuration.yaml under the mqtt: key.
# Trigger automations off sensor.paint_last_saved — it changes on every save.

mqtt:
  sensor:
    - name: "Paint Last Saved"
      unique_id: "qgames_paint_ts"
      state_topic: "qGames/paint/ts"
      value_template: "{{ value | int | timestamp_local }}"
      icon: "mdi:clock-outline"

    - name: "Paint Saved File"
      unique_id: "qgames_paint_saved"
      state_topic: "qGames/paint/saved"
      icon: "mdi:image"
