<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A bucket tipped to pour, drawn boldly enough to read at cursor size.
       Ink only: the colour being poured is added at the cursor, so the icon
       shows the paint the child actually chose. -->
  <g transform="rotate(-30 30 26)">
    <!-- handle, behind the body -->
    <path d="M18 20 a12 12 0 0 1 24 0" fill="none" stroke="#23262b"
          stroke-width="4" stroke-linecap="round"/>
    <!-- body: a clear tapered bucket -->
    <path d="M14 20 h32 l-5 24 a11 4 0 0 1 -22 0 z"
          fill="#ffffff" stroke="#23262b" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- rim -->
    <ellipse cx="30" cy="20" rx="16" ry="5.5"
             fill="#ffffff" stroke="#23262b" stroke-width="4.5"/>
  </g>
  <!-- the stream leaving the lip -->
  <path d="M46 34 q6 9 3 17" fill="none" stroke="#23262b"
        stroke-width="4.5" stroke-linecap="round"/>
</svg>
