; Godot export presets.
;
; FOUR Linux architectures on purpose. The 32-bit ones are not vestigial:
; Raspberry Pi OS still ships a 32-bit (armhf) image, and an arm64 binary will
; not run on it at all. Storage is cheaper than a support conversation.
;
; binary_format/embed_pck=true — one self-contained file per game per arch.
; With a separate .pck, Godot finds it by matching the executable's BASENAME,
; so renaming the binary during install silently breaks the game. Embedding
; removes that failure mode entirely and costs only the pack's own size.
;
; include_filter — build_config.cfg is a plain file, not an imported resource,
; and export_filter="all_resources" means RESOURCES. Without naming it here it
; is silently left out of the pack and the game falls back to its defaults:
; no broker, version "0.0.0-dev", and telemetry publishing nowhere while
; looking perfectly healthy. Verified by grepping the artifact, not assumed.
;
; texture_format: BC (s3tc/bptc) on x86, ETC2 on ARM — the formats those GPUs
; actually decode. These games ship no textures today, so this matters only for
; the day one does.

[preset.0]

name="Linux x86_64"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="build_config.cfg"
exclude_filter=""
export_path="../../dist/notes/notes-x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=false
texture_format/etc2=false
binary_format/architecture="x86_64"
ssh_remote_deploy/enabled=false
ssh_remote_deploy/host="user@host_ip"
ssh_remote_deploy/port="22"
ssh_remote_deploy/extra_args_ssh=""
ssh_remote_deploy/extra_args_scp=""
ssh_remote_deploy/run_script="Linux/linux_run.sh"
ssh_remote_deploy/cleanup_script="Linux/linux_cleanup.sh"

