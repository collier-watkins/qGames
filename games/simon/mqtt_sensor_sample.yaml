# Home Assistant MQTT sensors for qGames - Simon
# Copy the relevant blocks into your configuration.yaml under the mqtt: key.
# Trigger automations off sensor.simon_last_played (ts) — it always changes.

mqtt:
  sensor:
    - name: "Simon Last Played"
      unique_id: "qgames_simon_ts"
      state_topic: "qGames/simon/ts"
      value_template: "{{ value | int | timestamp_local }}"
      icon: "mdi:clock-outline"

    - name: "Simon Rounds"
      unique_id: "qgames_simon_rounds"
      state_topic: "qGames/simon/rounds"
      unit_of_measurement: "rounds"
      icon: "mdi:brain"
