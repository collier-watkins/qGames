# Home Assistant MQTT sensors for qGames - Memory Match
# Copy the relevant blocks into your configuration.yaml under the mqtt: key.
# Trigger automations off sensor.memory_game_last_played — it always changes,
# even when moves count repeats across back-to-back games.

mqtt:
  sensor:
    - name: "Memory Game Last Played"
      unique_id: "qgames_memory_ts"
      state_topic: "qGames/memory/ts"
      value_template: "{{ value | int | timestamp_local }}"
      icon: "mdi:clock-outline"

    - name: "Memory Game Moves"
      unique_id: "qgames_memory_moves"
      state_topic: "qGames/memory/moves"
      unit_of_measurement: "moves"
      icon: "mdi:cards"

    - name: "Memory Game Result"
      unique_id: "qgames_memory_result"
      state_topic: "qGames/memory/result"
      icon: "mdi:trophy"
