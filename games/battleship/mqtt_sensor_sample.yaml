# Home Assistant MQTT sensors for qGames - Battleship
# Copy the relevant blocks into your configuration.yaml under the mqtt: key.
# Trigger automations off sensor.battleship_last_played — it always changes,
# even when result and shot count repeat across games.

mqtt:
  sensor:
    - name: "Battleship Last Played"
      unique_id: "qgames_battleship_ts"
      state_topic: "qGames/battleship/ts"
      value_template: "{{ value | int | timestamp_local }}"
      icon: "mdi:clock-outline"

    - name: "Battleship Result"
      unique_id: "qgames_battleship_result"
      state_topic: "qGames/battleship/result"
      icon: "mdi:trophy"

    - name: "Battleship Shots"
      unique_id: "qgames_battleship_shots"
      state_topic: "qGames/battleship/shots"
      unit_of_measurement: "shots"
      icon: "mdi:target"
